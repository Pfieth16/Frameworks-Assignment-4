<div class="container mt-5" style="max-width: 30rem">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="card-title mb-3">Account Access</h2>
      <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          #emailInput
          type="email"
          class="form-control"
          placeholder="you@example.com"
        />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          #passwordInput
          type="password"
          class="form-control"
          placeholder="Enter password"
        />
      </div>
      <div class="d-grid gap-2">
        <button
          type="button"
          class="btn btn-primary"
          (click)="signIn(emailInput.value, passwordInput.value)"
        >
          Sign In
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          (click)="signUp(emailInput.value, passwordInput.value)"
        >
          Create Account
        </button>
      </div>
      <div class="mt-3 text-center">
        <a routerLink="/">Back to Dashboard</a>
      </div>
    </div>
  </div>
</div>
